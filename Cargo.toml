[package]
name = "mirrorstack"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
description = "Official command-line tool for the MirrorStack platform"
license = "Apache-2.0"

[[bin]]
name = "mirrorstack"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10.7"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
url = "2"
dirs = "6"
open = "5"
anyhow = "1"
thiserror = "2"
tempfile = "3"
dotenvy = "0.15"
dialoguer = { version = "0.11", default-features = false }
console = "0.15"
indicatif = "0.17"
ctrlc = "3"
jsonschema = { version = "0.49.2", default-features = false }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
zip = { version = "7", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
fs2 = "0.4"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
mockito = "1.6"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
