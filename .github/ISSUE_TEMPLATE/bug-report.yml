name: Bug Report
description: Report something in the CLI that isn't working
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
      placeholder: A clear description of the bug
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The exact command you ran and what it printed. Remove any tokens first.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: CLI version
      description: Output of `mirrorstack --version`
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "e.g. macOS 15 (arm64), Ubuntu 24.04"
    validations:
      required: false
