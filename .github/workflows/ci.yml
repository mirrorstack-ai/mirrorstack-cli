name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

jobs:
  lint:
    name: Lint (fmt + clippy)
    # Runner selection is data, not code: the org variable RUNNER_LABELS points
    # CI at the shared self-hosted fleet. The literal is only the fallback used
    # when the variable is unset. (Repeated per job on purpose: GitHub Actions
    # does not support YAML anchors.)
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-24.04-arm"]') }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Bootstrap rustup
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if command -v rustup >/dev/null 2>&1; then
            echo "rustup already present: $(rustup --version)"
            exit 0
          fi
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features

  test:
    name: Test
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-24.04-arm"]') }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: TEMPORARY runner probe
        shell: bash
        run: |
          uname -a || true
          cat /etc/os-release 2>/dev/null || true
          for t in curl git gh cc gcc clang ld make pkg-config node rustup cargo sudo apt-get apk; do
            printf '%-12s %s\n' "$t" "$(command -v "$t" 2>/dev/null || echo MISSING)"
          done

      - name: Bootstrap rustup
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if command -v rustup >/dev/null 2>&1; then
            echo "rustup already present: $(rustup --version)"
            exit 0
          fi
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        run: rustup update stable && rustup default stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: cargo test
        run: cargo test --all-features --no-fail-fast

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # This matrix is the cross-platform compile check, so only the Linux leg
        # can follow RUNNER_LABELS onto the self-hosted fleet (Linux/arm64). The
        # macOS and Windows legs must stay on GitHub-hosted images -- there is no
        # self-hosted runner for either OS. The leg names feed the required
        # status checks, so `os` keeps its ubuntu/macos/windows-latest values.
        include:
          - os: ubuntu-latest
            runner: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-24.04-arm"]') }}
          - os: macos-latest
            runner: macos-latest
          - os: windows-latest
            runner: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Bootstrap rustup
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if command -v rustup >/dev/null 2>&1; then
            echo "rustup already present: $(rustup --version)"
            exit 0
          fi
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        run: rustup update stable && rustup default stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: cargo build --release
        run: cargo build --release --locked
